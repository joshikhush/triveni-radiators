<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Triveni — Who We Are (Final)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0a0e27;
    --ink:#11142b;
    --ink-dim:#c3c6d9;
    --ink-mid:#8a8fa8;
    --bg:#f7f8fb;
    --indigo:#5b4cf0;
    --indigo-2:#7c6ff5;
    --indigo-tint:#ecebfe;
    --line:#e5e7f0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:'Inter', 'Segoe UI', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }

  header{
    background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between;
    padding:18px 40px; position:sticky; top:0; z-index:20;
  }
  .logo{ font-weight:700; letter-spacing:.04em; font-size:15px; }
  nav{ display:flex; gap:30px; font-size:14px; color:#c7cae0; }
  nav span:first-child{ color:#fff; }
  header button{ background:var(--indigo); color:#fff; border:none; padding:10px 18px; border-radius:8px; font-size:13.5px; font-weight:600; }

  /* ============ WHO WE ARE — Ayr format, site colors ============ */
  .intro-hero{
    padding:130px 24px 20px; text-align:center;
    display:flex; flex-direction:column; align-items:center;
  }
  .eyebrow{ color:var(--indigo); font-size:13px; font-weight:700; letter-spacing:.14em; margin-bottom:22px; }
  .intro-hero h1{
    font-size:clamp(36px,5.6vw,64px); font-weight:600; line-height:1.12; letter-spacing:-0.015em;
    max-width:820px; color:var(--ink);
  }

  .intro-reveal{ padding:50px 24px 140px; display:flex; justify-content:center; }
  .intro-reveal-inner{ max-width:700px; }
  .intro-reveal p{ font-size:clamp(19px,2.3vw,23px); line-height:1.85; text-align:center; font-weight:400; margin-bottom:30px; }
  .intro-reveal .word{ color:var(--ink-dim); }

  /* ============ PILLARS — Bold Editorial, recolored ============ */
  .pin-wrap{ position:relative; height:300vh; background:var(--bg); }
  .pin-sticky{ position:sticky; top:0; height:100vh; max-width:920px; margin:0 auto; padding:0 40px; display:flex; align-items:center; overflow:hidden; }
  .rail{ position:absolute; top:56px; left:50%; transform:translateX(-50%); display:flex; gap:30px; }
  .rail .rail-item{ font-size:12.5px; font-weight:700; letter-spacing:.08em; color:var(--ink-mid); padding-bottom:9px; border-bottom:2px solid transparent; transition:all .3s; text-transform:uppercase; }
  .rail .rail-item.active{ color:var(--ink); border-bottom-color:var(--indigo); }
  .stack{ position:relative; width:100%; height:56vh; }
  .stack .card{ position:absolute; inset:0; opacity:0; filter:blur(10px); transform:translateY(14px); display:flex; flex-direction:column; justify-content:center; }
  .stack .num-big{ font-size:15px; font-weight:800; color:var(--indigo); margin-bottom:10px; letter-spacing:.05em; }
  .stack h2{ font-size:clamp(30px,5vw,54px); font-weight:700; line-height:1.1; letter-spacing:-.02em; margin-bottom:20px; color:var(--ink); }
  .stack p{ max-width:520px; color:var(--ink-mid); font-size:16.5px; line-height:1.75; border-left:2px solid var(--indigo-tint); padding-left:20px; }
  .stack .tag{ display:inline-block; margin-top:20px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#c47a1f; background:#fdf1e0; padding:5px 11px; border-radius:20px; width:fit-content; }
  .stack .vals{ display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:6px; max-width:520px; }
  .stack .vals span{ font-size:14.5px; color:var(--ink-mid); display:flex; align-items:center; gap:8px; }
  .stack .vals span::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--indigo); }

  .after-note{ text-align:center; padding:50px 24px; color:var(--ink-mid); font-size:13.5px; background:#fff; border-top:1px solid var(--line); }
</style>
</head>
<body>

<header>
  <div class="logo">TRIVENI RADIATORS</div>
  <nav><span>Home</span><span>Product</span><span>Credential</span><span>Milestones</span><span>Clientele</span><span>Careers</span></nav>
  <button>Contact Us</button>
</header>

<section class="intro-hero">
  <div class="eyebrow">01 — Who We Are</div>
  <h1>Where we're going &amp; how we got here.</h1>
</section>

<section class="intro-reveal">
  <div class="intro-reveal-inner">
    <p id="rv1"></p>
    <p id="rv2"></p>
    <p id="rv3"></p>
  </div>
</section>

<div class="pin-wrap" id="wrap">
  <div class="pin-sticky">
    <div class="rail" id="rail"></div>
    <div class="stack" id="stack"></div>
  </div>
</div>

<div class="after-note">↓ Product / Credential / Milestones sections continue below, unchanged</div>

<script>
const P1 = "From a French multinational MOU in 2012 to one of India's largest radiator suppliers, our journey has been built one transformer at a time.";
const P2 = "Siemens, GE, Hitachi, Toshiba and PGCIL trust us to build the radiators inside transformers that cannot afford to fail — thirteen years of unbroken supply, engineered to the highest class approved in the country.";
const P3 = "From engineering and manufacturing to delivery and long-term support, we stay close to every project, treating each dispatch as one more transformer that has to run without excuses.";

const DATA = [
  { n:'01', label:'Our Mission', h:'To deliver high-quality, reliable radiator solutions.', p:'That enhance transformer performance and customer satisfaction, on every order we ship.' },
  { n:'02', label:'Our Vision', h:'To be the most trusted radiator brand.', p:'Globally recognized for innovation and engineering excellence, built one project at a time.' },
  { n:'03', label:'Core Values', h:'Five principles behind every unit.', vals:['Integrity','Quality','Innovation','Customer Commitment','Sustainability'] }
];

function clamp(v,a,b){ return Math.min(b, Math.max(a, v)); }

/* ---- one-directional word reveal, light theme ---- */
function setupReveal(id, text){
  const el = document.getElementById(id);
  el.innerHTML = text.split(' ').map(w=>`<span class="word" data-revealed="0">${w}</span>`).join(' ');
  return el.querySelectorAll('.word');
}
const wordSets = [
  setupReveal('rv1', P1),
  setupReveal('rv2', P2),
  setupReveal('rv3', P3)
];

function updateReveal(){
  const vh = window.innerHeight;
  const triggerY = vh * 0.62;
  const fadeBand = vh * 0.22;
  wordSets.forEach(words=>{
    words.forEach(w=>{
      if (w.dataset.revealed === '1') return;
      const r = w.getBoundingClientRect();
      if (r.top < triggerY) {
        w.dataset.revealed = '1';
        w.style.color = '#11142b';
      } else {
        const t = clamp(1 - (r.top - triggerY)/fadeBand, 0, 1);
        const g1=[195,198,217], g2=[17,20,43];
        const rr=Math.round(g1[0]+(g2[0]-g1[0])*t), gg=Math.round(g1[1]+(g2[1]-g1[1])*t), bb=Math.round(g1[2]+(g2[2]-g1[2])*t);
        w.style.color = `rgb(${rr},${gg},${bb})`;
      }
    });
  });
}

/* ---- pinned Bold Editorial stack, light theme ---- */
const rail = document.getElementById('rail');
const stack = document.getElementById('stack');
const wrap = document.getElementById('wrap');
DATA.forEach((d,i)=>{
  rail.insertAdjacentHTML('beforeend', `<div class="rail-item" data-i="${i}">${d.label}</div>`);
  const body = d.vals
    ? `<div class="vals">${d.vals.map(v=>`<span>${v}</span>`).join('')}</div>`
    : `<p>${d.p}</p>`;
  stack.insertAdjacentHTML('beforeend', `<div class="card" data-i="${i}"><div class="num-big">${d.n}</div><h2>${d.h}</h2>${body}</div>`);
});
const cards = stack.querySelectorAll('.card');
const railItems = rail.querySelectorAll('.rail-item');
const N = DATA.length;

function updatePin(){
  const rect = wrap.getBoundingClientRect();
  const total = rect.height - window.innerHeight;
  const scrolled = clamp(-rect.top, 0, total);
  const progress = total>0 ? scrolled/total : 0;
  const scaled = progress*N;
  cards.forEach((card,i)=>{
    const local = scaled-i;
    let opacity,blur,ty;
    if(local<=0){ opacity=0; blur=10; ty=14; }
    else if(local<0.18){ const t=local/0.18; opacity=t; blur=10*(1-t); ty=14*(1-t); }
    else if(local<0.72){ opacity=1; blur=0; ty=0; }
    else if(local<1){ const t=(local-0.72)/0.28; opacity=1-t; blur=10*t; ty=-10*t; }
    else { opacity=0; blur=10; ty=-10; }
    card.style.opacity=opacity;
    card.style.filter=`blur(${blur}px)`;
    card.style.transform=`translateY(${ty}px)`;
  });
  const activeIndex = clamp(Math.floor(scaled),0,N-1);
  railItems.forEach((r,i)=>r.classList.toggle('active', i===activeIndex));
}

let ticking=false;
function runAll(){ updateReveal(); updatePin(); }
document.addEventListener('scroll', ()=>{
  if(!ticking){ requestAnimationFrame(()=>{ runAll(); ticking=false; }); ticking=true; }
}, {passive:true});
window.addEventListener('resize', runAll);
runAll();
</script>

</body>
</html>
